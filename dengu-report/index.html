<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dengu Report - Demo</title>


    <style>
        /* ---------------------------------------------------------
           Reset
        --------------------------------------------------------- */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
        }


        /* ---------------------------------------------------------
           Main Wrapper
        --------------------------------------------------------- */

        .demo-wrapper {
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* ---------------------------------------------------------
           Toolbar
        --------------------------------------------------------- */

        .demo-toolbar {
            width: 100%;

            padding: 12px 20px;

            background: #111827;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            flex-wrap: wrap;
        }


        /* ---------------------------------------------------------
           Title
        --------------------------------------------------------- */

        .demo-title {
            color: #ffffff;

            font-size: 18px;
            font-weight: 600;
        }


        /* ---------------------------------------------------------
           Demo Controls
        --------------------------------------------------------- */

        .demo-selector {
            display: flex;
            align-items: center;

            gap: 8px;
        }


        /* ---------------------------------------------------------
           Buttons
        --------------------------------------------------------- */

        .demo-btn {
            padding: 10px 15px;

            border: 0;
            border-radius: 6px;

            background: #2563eb;

            color: #ffffff;

            font-size: 14px;
            font-weight: 500;

            cursor: pointer;

            white-space: nowrap;

            transition: background 0.2s ease;
        }

        .demo-btn:hover {
            background: #1d4ed8;
        }

        .demo-btn:disabled {
            background: #6b7280;

            color: #d1d5db;

            cursor: not-allowed;

            opacity: 0.7;
        }


        /* ---------------------------------------------------------
           Dropdown
        --------------------------------------------------------- */

        .demo-select {
            min-width: 150px;

            padding: 10px 12px;

            border: 0;
            border-radius: 6px;

            background: #ffffff;

            color: #111827;

            font-size: 14px;

            cursor: pointer;

            outline: none;
        }

        .demo-select:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35);
        }


        /* ---------------------------------------------------------
           Iframe Container
        --------------------------------------------------------- */

        .iframe-container {
            position: relative;

            width: 100%;

            flex: 1;

            background: #ffffff;

            overflow: hidden;
        }


        /* ---------------------------------------------------------
           Iframe
        --------------------------------------------------------- */

        .demo-frame {
            display: block;

            width: 100%;
            height: calc(100vh - 65px);

            min-height: 600px;

            border: 0;

            background: #ffffff;
        }


        /* ---------------------------------------------------------
           Loading
        --------------------------------------------------------- */

        .loader {
            position: absolute;

            inset: 0;

            z-index: 10;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #ffffff;
        }

        .loader.hidden {
            display: none;
        }


        /* ---------------------------------------------------------
           Spinner
        --------------------------------------------------------- */

        .spinner {
            width: 40px;
            height: 40px;

            border: 4px solid #e5e7eb;

            border-top-color: #2563eb;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* ---------------------------------------------------------
           Mobile
        --------------------------------------------------------- */

        @media (max-width: 600px) {

            .demo-toolbar {
                padding: 10px 12px;

                align-items: stretch;
            }


            .demo-title {
                width: 100%;

                text-align: center;
            }


            .demo-selector {
                width: 100%;

                display: flex;
            }


            .demo-btn {
                flex: 0 0 auto;

                padding: 10px 12px;
            }


            .demo-select {
                flex: 1;

                min-width: 0;

                width: 100%;
            }


            .demo-frame {
                height: calc(100vh - 105px);

                min-height: 500px;
            }

        }
    </style>

</head>


<body>


    <div class="demo-wrapper">


        <!-- =========================================================
         Toolbar
    ========================================================== -->

        <div class="demo-toolbar">


            <div class="demo-title">
                Demo Websites
            </div>


            <div class="demo-selector">


                <!-- Previous -->

                <button type="button" id="prevBtn" class="demo-btn" onclick="previousDemo()">
                    ← Previous
                </button>


                <!-- Demo Dropdown -->

                <select name="demoSelect" id="demoSelect" class="demo-select" onchange="switchDemo(this.value)">
                    <option value="1">Demo 1</option>

                    <option value="2">Demo 2</option>

                    <option value="3">Demo 3</option>

                    <option value="4">Demo 4</option>

                    <option value="5">Demo 5</option>

                    <option value="6">Demo 6</option>

                    <option value="7">Demo 7</option>

                    <option value="8">Demo 8</option>

                    <option value="9">Demo 9</option>

                    <option value="10">Demo 10</option>


                </select>


                <!-- Next -->

                <button type="button" id="nextBtn" class="demo-btn" onclick="nextDemo()">
                    Next →
                </button>


            </div>


        </div>


        <!-- =========================================================
         Iframe
    ========================================================== -->

        <div class="iframe-container">


            <!-- Loading -->

            <div id="loader" class="loader">

                <div class="spinner"></div>

            </div>


            <!-- Demo Website -->

            <iframe id="demoFrame" class="demo-frame" src="/demoWebsites/dengu-report/00demo/demo1/" title="Demo 1"
                allowfullscreen></iframe>


        </div>


    </div>



    <script>


        /*
        |--------------------------------------------------------------------------
        | Demo URLs
        |--------------------------------------------------------------------------
        */

        const demoUrls = "";


        /*
        |--------------------------------------------------------------------------
        | Elements
        |--------------------------------------------------------------------------
        */

        const iframe = document.getElementById('demoFrame');

        const loader = document.getElementById('loader');

        const demoSelect = document.getElementById('demoSelect');

        const prevBtn = document.getElementById('prevBtn');

        const nextBtn = document.getElementById('nextBtn');


        /*
        |--------------------------------------------------------------------------
        | Maximum Demo
        |--------------------------------------------------------------------------
        */

        const totalDemos = 10;

        // Read the selected demo from ?demo=1 ... ?demo=10.
        const initialParams = new URLSearchParams(window.location.search);
        let initialDemo = parseInt(initialParams.get('demo') || '1', 10);

        if (!demoUrls[initialDemo]) {
            initialDemo = 1;
        }

        demoSelect.value = initialDemo;
        iframe.src = demoUrls[initialDemo];
        iframe.title = 'Demo ' + initialDemo;


        /*
        |--------------------------------------------------------------------------
        | Switch Demo
        |--------------------------------------------------------------------------
        */

        function switchDemo(demoNumber) {

            demoNumber = parseInt(demoNumber, 10);


            // Check if demo exists

            if (!demoUrls[demoNumber]) {
                return;
            }


            // Show loading

            loader.classList.remove('hidden');


            // Change iframe

            iframe.src = demoUrls[demoNumber];

            iframe.title = 'Demo ' + demoNumber;


            // Update dropdown

            demoSelect.value = demoNumber;


            // Update Previous / Next buttons

            updateButtons(demoNumber);


            // Update browser URL

            const url = new URL(
                window.location.href
            );

            url.searchParams.set(
                'demo',
                demoNumber
            );


            window.history.pushState(
                {
                    demo: demoNumber
                },
                '',
                url
            );

        }


        /*
        |--------------------------------------------------------------------------
        | Previous Demo
        |--------------------------------------------------------------------------
        */

        function previousDemo() {

            const currentDemo = parseInt(
                demoSelect.value,
                10
            );


            if (currentDemo > 1) {

                switchDemo(
                    currentDemo - 1
                );

            }

        }


        /*
        |--------------------------------------------------------------------------
        | Next Demo
        |--------------------------------------------------------------------------
        */

        function nextDemo() {

            const currentDemo = parseInt(
                demoSelect.value,
                10
            );


            if (currentDemo < totalDemos) {

                switchDemo(
                    currentDemo + 1
                );

            }

        }


        /*
        |--------------------------------------------------------------------------
        | Update Buttons
        |--------------------------------------------------------------------------
        */

        function updateButtons(demoNumber) {

            // Disable Previous on Demo 1

            prevBtn.disabled =
                demoNumber <= 1;


            // Disable Next on Demo 10

            nextBtn.disabled =
                demoNumber >= totalDemos;

        }


        /*
        |--------------------------------------------------------------------------
        | Iframe Loaded
        |--------------------------------------------------------------------------
        */

        iframe.addEventListener(
            'load',
            function () {

                loader.classList.add(
                    'hidden'
                );

            }
        );


        /*
        |--------------------------------------------------------------------------
        | Browser Back / Forward
        |--------------------------------------------------------------------------
        */

        window.addEventListener(
            'popstate',
            function () {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                let demoNumber = parseInt(
                    params.get('demo') || '1',
                    10
                );


                // Validate

                if (!demoUrls[demoNumber]) {
                    demoNumber = 1;
                }


                // Update dropdown

                demoSelect.value =
                    demoNumber;


                // Show loading

                loader.classList.remove(
                    'hidden'
                );


                // Load iframe

                iframe.src =
                    demoUrls[demoNumber];


                iframe.title =
                    'Demo ' + demoNumber;


                // Update buttons

                updateButtons(
                    demoNumber
                );

            }
        );


        /*
        |--------------------------------------------------------------------------
        | Initial Button State
        |--------------------------------------------------------------------------
        */

        updateButtons(initialDemo);


    </script>


</body>

</html>
